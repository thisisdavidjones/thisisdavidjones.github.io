{{ define "main" }}
  <section class="heading"><h1>{{ .Title }}</h1></section>
  <article class="taxonomy-list">
    {{ range .Pages.ByDate.Reverse }}
      <p><a href="{{ .RelPermalink }}">{{ .Title }}</a> <small>{{ .Date.Format "2006" }}</small></p>
    {{ end }}
  </article>
  <p class="parent-link"><a href="{{ "/tags/" | relURL }}">← All tags</a></p>
{{ end }}
