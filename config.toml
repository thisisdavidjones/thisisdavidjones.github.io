baseURL = 'https://thisisdavidjones.com/'
languageCode = 'en-gb'
title = 'The website of David Jones'
theme = 'david'
enableGitInfo = true

[params]
    RSSLink = "/index.xml"
    author = "David Jones"
    github = ""
    twitter = "askdavidjones"
    email = "me@thisisdavidjones.com"
    dateFormat = "02 Jan 2006"
    googleAnalytics = 'G-67Z8EJXRP3'
    math = true
    description = "Essays, notes, links and clippings on literature, history, technology, travel, art, economics and other interests."

[permalinks]
    blog = "/blog/:year/:month/:slug"

[taxonomies]
    category = 'categories'
    series = 'series'
    tag = 'tags'
    topic = 'topics'

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
            hardWraps = false
        [markup.goldmark.parser.attribute]
            block = true
            title = true
        [markup.goldmark.extensions]
            [markup.goldmark.extensions.passthrough]
                enable = true
                [markup.goldmark.extensions.passthrough.delimiters]
                    block = [['\[', '\]'], ['$$', '$$']]
                    inline = [['\(', '\)']]

[related]
    threshold = 60
    includeNewer = true
    toLower = true

    [[related.indices]]
        applyFilter = false
        cardinalityThreshold = 0
        name = 'topics'
        pattern = ''
        toLower = true
        type = 'basic'
        weight = 100

    [[related.indices]]
        applyFilter = false
        cardinalityThreshold = 0
        name = 'tags'
        pattern = ''
        toLower = true
        type = 'basic'
        weight = 20
